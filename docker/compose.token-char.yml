# TOKEN-CHAR only. MTCP characterization environment.
# Do not combine this file with the development project or either isolated experimental project.
# This file does not create a C6 window and does not ingest a corpus.

name: thoth-char

services:
  llama-server:
    command:
      - -m
      - ${LLAMA_CHAT_MODEL:-/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -c
      - "8192"

  thoth-engine:
    environment:
      THOTH_ENVIRONMENT_LABEL: TOKEN-CHAR
      THOTH_MTCP_ENABLED: ${THOTH_MTCP_ENABLED:-0}
      THOTH_GENERATION_MAX_TOKENS: ${THOTH_GENERATION_MAX_TOKENS:-__UNSET__}
      THOTH_INFERENCE_SEED: ${THOTH_INFERENCE_SEED:-__UNSET__}
